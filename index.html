<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <p class="eyebrow">STUDENT TOOL</p>
        <h1>Attendance Tracker</h1>
        <p>Record daily attendance and keep a clear summary.</p>
      </section>
      <section class="card">
        <form id="attendanceForm">
          <label>Student name<input id="studentName" required placeholder="Enter student name" /></label>
          <label>Date<input id="attendanceDate" type="date" required /></label>
          <label>Status<select id="status"><option value="Present">Present</option><option value="Absent">Absent</option></select></label>
          <button type="submit">Add Attendance</button>
        </form>
      </section>
      <section class="summary" aria-label="Attendance summary">
        <div><span id="totalCount">0</span><small>Total records</small></div>
        <div><span id="presentCount">0</span><small>Present</small></div>
        <div><span id="absentCount">0</span><small>Absent</small></div>
      </section>
      <section class="card">
        <div class="table-header"><h2>Attendance records</h2><button class="secondary" id="clearAll" type="button">Clear all</button></div>
        <div class="table-wrap"><table><thead><tr><th>Student</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="records"></tbody></table></div>
        <p id="emptyState">No attendance records yet.</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
